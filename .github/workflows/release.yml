name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Require a main commit and matching workspace version
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version="$(
            sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' \
              Cargo.toml
          )"
          test -n "$version"
          test "$GITHUB_REF_NAME" = "v$version"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  build-host:
    name: Build ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
          - name: macos-aarch64
            os: macos-14
            rust_target: aarch64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.name }}
      - name: Build Linux host runtime
        if: runner.os == 'Linux'
        run: >-
          A3S_OCI_GIT_REVISION="$GITHUB_SHA"
          .github/scripts/build-static-musl.sh
          "${{ matrix.rust_target }}"
          a3s-oci-cli
          a3s-oci-agent
          a3s-oci-containerd-shim
      - name: Verify static Linux host runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          release="target/${{ matrix.rust_target }}/release"
          .github/scripts/verify-static-elf.sh \
            "$release/a3s-oci" \
            "$release/a3s-oci-agent" \
            "$release/containerd-shim-a3s-oci-v2"
      - name: Build pinned CRIU qualification tool
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            git \
            libaio-dev \
            libbsd-dev \
            libcap-dev \
            libdrm-dev \
            libgnutls28-dev \
            libnftables-dev \
            libnl-3-dev \
            libnl-route-3-dev \
            libprotobuf-c-dev \
            libprotobuf-dev \
            libselinux1-dev \
            pkg-config \
            protobuf-c-compiler \
            protobuf-compiler \
            python3-protobuf
          bash .github/scripts/build-pinned-criu.sh \
            /usr/local/lib/a3s-oci-tools/criu-4.2.1
      - name: Build macOS or Windows host runtime
        if: runner.os != 'Linux'
        run: cargo build --release -p a3s-oci-cli -p a3s-oci-krun
      - name: Sign macOS host executables with HVF entitlement
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for executable in target/release/a3s-oci target/release/a3s-oci-krun-shim; do
            codesign --force --sign - \
              --entitlements packaging/macos/a3s-oci-hvf.entitlements \
              "$executable"
            codesign --verify --strict "$executable"
          done
      - name: Package host runtime
        shell: bash
        run: |
          package="a3s-oci-runtime-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "$package/docs"
          cp README.md CHANGELOG.md LICENSE "$package/"
          cp docs/release-verification.md "$package/docs/"
          case "${{ runner.os }}" in
            Linux)
              release="target/${{ matrix.rust_target }}/release"
              cp "$release/a3s-oci" \
                "$release/a3s-oci-agent" \
                "$release/containerd-shim-a3s-oci-v2" \
                "$package/"
              mkdir -p "$package/compat"
              cp docs/checkpoint-contract.md "$package/docs/"
              cp docs/containerd-runtime-v2.md "$package/docs/"
              cp compat/containerd-runtime-v2.json "$package/compat/"
              A3S_OCI_CRIU_BINARY=/usr/local/lib/a3s-oci-tools/criu-4.2.1 \
                A3S_QUALIFICATION_SOURCE_COMMIT="$GITHUB_SHA" \
                bash .github/scripts/native-linux-package-smoke.sh "$package"
              ;;
            macOS)
              cp target/release/a3s-oci target/release/a3s-oci-krun-shim "$package/"
              cp -R target/release/a3s-oci-krun-runtime "$package/"
              ;;
            Windows)
              cp target/release/a3s-oci.exe \
                target/release/a3s-oci-krun-shim.exe "$package/"
              ;;
          esac
          tar -czf "${package}.tar.gz" "$package"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-${{ matrix.name }}
          path: a3s-oci-runtime-${{ github.ref_name }}-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  build-guest-agents:
    name: Build static Linux guest agents
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-guest-agents
      - name: Build static guest agents
        run: .github/scripts/build-static-guest-agents.sh
      - name: Verify and package static agents
        shell: bash
        run: |
          package="a3s-oci-runtime-${GITHUB_REF_NAME}-guest-agents"
          mkdir -p "$package/docs"
          .github/scripts/verify-static-elf.sh \
            target/x86_64-unknown-linux-musl/release/a3s-oci-agent \
            target/aarch64-unknown-linux-musl/release/a3s-oci-agent
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            agent="target/$target/release/a3s-oci-agent"
            cp "$agent" "$package/a3s-oci-agent-$target"
          done
          cp README.md CHANGELOG.md LICENSE "$package/"
          cp docs/release-verification.md "$package/docs/"
          tar -czf "${package}.tar.gz" "$package"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guest-agents
          path: a3s-oci-runtime-${{ github.ref_name }}-guest-agents.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-host, build-guest-agents]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Flatten artifacts and create checksums
        shell: bash
        run: |
          mkdir -p dist
          find artifacts -type f -name '*.tar.gz' -exec cp {} dist/ \;
          test "$(find dist -type f -name '*.tar.gz' | wc -l)" -eq 5
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: Generate signed build provenance
        id: provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS
      - name: Retain portable Sigstore bundle
        shell: bash
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          test -f "$PROVENANCE_BUNDLE"
          cp "$PROVENANCE_BUNDLE" \
            "dist/a3s-oci-runtime-${GITHUB_REF_NAME}-provenance.sigstore.json"
      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: A3S OCI Runtime ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
