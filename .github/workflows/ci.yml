name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    needs: guest-agent-musl
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'macOS'
        name: Download immutable macOS system image
        uses: actions/download-artifact@v4
        with:
          name: macos-system-image
          path: ${{ runner.temp }}/a3s-oci-macos-system-image
      - if: runner.os == 'Windows'
        name: Download immutable Windows system image
        uses: actions/download-artifact@v4
        with:
          name: windows-system-image
          path: ${{ runner.temp }}/a3s-oci-windows-system-image
      - if: runner.os == 'macOS'
        name: Pin immutable macOS system-image path
        shell: bash
        run: |
          system_image_dir="$RUNNER_TEMP/a3s-oci-macos-system-image"
          manifest="$system_image_dir/system-image.json"
          image="$system_image_dir/a3s-oci-system.ext4"
          archive="$system_image_dir/a3s-oci-system.ext4.xz"
          test -f "$manifest"
          test -f "$image"
          test -f "$archive"
          test "$(jq --raw-output '.image.sha256' "$manifest")" = "$(shasum -a 256 "$image" | awk '{print $1}')"
          test "$(jq --raw-output '.image.archive_sha256' "$manifest")" = "$(shasum -a 256 "$archive" | awk '{print $1}')"
          chmod 0444 "$manifest" "$image" "$archive"
          printf 'A3S_OCI_MACOS_SYSTEM_IMAGE_MANIFEST=%s\n' "$manifest" >> "$GITHUB_ENV"
      - if: runner.os == 'Windows'
        name: Pin immutable Windows system-image path
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'a3s-oci-windows-system-image'
          $manifest = Join-Path $directory 'system-image.json'
          $image = Join-Path $directory 'a3s-oci-system.ext4'
          $archive = Join-Path $directory 'a3s-oci-system.ext4.xz'
          foreach ($path in @($manifest, $image, $archive)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing Windows system-image artifact: $path"
            }
          }
          $decoded = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
          $imageSha256 = (Get-FileHash -LiteralPath $image -Algorithm SHA256).Hash.ToLowerInvariant()
          $archiveSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($decoded.schema_version -ne 'a3s.oci.windows-system-image.v1' -or
              $decoded.architecture -ne 'x86_64' -or
              $decoded.image.sha256 -ne $imageSha256 -or
              $decoded.image.archive_sha256 -ne $archiveSha256) {
            throw 'Downloaded Windows system image failed manifest verification.'
          }
          "A3S_OCI_WINDOWS_SYSTEM_IMAGE_MANIFEST=$manifest" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Exhaustive durable-state and host-driver fault matrix
        run: cargo test -p a3s-oci-runtime fault_matrix
      - name: Workspace tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --all-targets 2>&1 \
            | tee "$RUNNER_TEMP/a3s-oci-workspace-tests.log"
      - if: failure()
        name: Publish workspace test failure
        shell: bash
        run: |
          test_log="$RUNNER_TEMP/a3s-oci-workspace-tests.log"
          if [[ -f "$test_log" ]]; then
            # GitHub truncates workflow-command annotations around 4 KiB.
            # The final Cargo lines contain the panic and assertion context.
            excerpt="$(tail -n 28 "$test_log")"
            excerpt="${excerpt//'%'/'%25'}"
            excerpt="${excerpt//$'\r'/'%0D'}"
            excerpt="${excerpt//$'\n'/'%0A'}"
            printf '::error title=Workspace tests failed::%s\n' "$excerpt"
            {
              echo '### Workspace test failure'
              echo
              echo '<details open><summary>Last 240 log lines</summary>'
              echo
              echo '```text'
              tail -n 240 "$test_log"
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: failure()
        name: Upload workspace test failure
        uses: actions/upload-artifact@v4
        with:
          name: workspace-test-failure-${{ runner.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/a3s-oci-workspace-tests.log
          if-no-files-found: ignore
          retention-days: 14
      - run: cargo run -p a3s-oci-cli -- features
      - if: runner.os == 'Linux'
        name: Isolated Linux libkrun context lifecycle
        run: cargo run -p a3s-oci-krun --bin a3s-oci-krun-shim -- context-smoke
      - if: runner.os == 'macOS'
        name: Hypervisor.framework VM object lifecycle
        shell: bash
        run: |
          smoke="$RUNNER_TEMP/a3s-oci-hvf-smoke"
          cp target/debug/a3s-oci "$smoke"
          codesign --force --sign - \
            --entitlements packaging/macos/a3s-oci-hvf.entitlements \
            "$smoke"
          codesign --verify --strict "$smoke"

          set +e
          output="$("$smoke" hvf-smoke)"
          status=$?
          set -e
          printf '%s\n' "$output"

          support="$(sysctl -n kern.hv_support 2>/dev/null || printf unavailable)"
          if [[ "$support" == "1" ]]; then
            test "$status" -eq 0
            jq --exit-status \
              '.status == "available" and .vm_created and .vm_destroyed' \
              <<<"$output" >/dev/null
          else
            test "$status" -eq 2
            jq --exit-status \
              '.status == "unavailable" and (.vm_created | not) and (.vm_destroyed | not)' \
              <<<"$output" >/dev/null
          fi
      - if: runner.os == 'macOS'
        name: Isolated libkrun context lifecycle
        shell: bash
        run: |
          smoke_dir="$RUNNER_TEMP/a3s-oci-krun-context"
          mkdir -p "$smoke_dir"
          cp target/debug/a3s-oci-krun-shim "$smoke_dir/"
          cp -R target/debug/a3s-oci-krun-runtime "$smoke_dir/"

          codesign --verify --strict \
            "$smoke_dir/a3s-oci-krun-runtime/libkrun.1.17.0.dylib"
          codesign --verify --strict \
            "$smoke_dir/a3s-oci-krun-runtime/libkrunfw.5.dylib"
          codesign --force --sign - \
            --entitlements packaging/macos/a3s-oci-hvf.entitlements \
            "$smoke_dir/a3s-oci-krun-shim"
          codesign --verify --strict "$smoke_dir/a3s-oci-krun-shim"

          output="$("$smoke_dir/a3s-oci-krun-shim" context-smoke)"
          printf '%s\n' "$output"
          jq --exit-status \
            '.platform == "macos" and .status == "available"
             and .runtime_bundle_loaded and .context_created
             and .vm_configured and .agent_vsock_configured
             and .context_released' \
            <<<"$output" >/dev/null

          tampered_dir="$RUNNER_TEMP/a3s-oci-krun-context-tampered"
          cp -R "$smoke_dir" "$tampered_dir"
          chmod u+w \
            "$tampered_dir/a3s-oci-krun-runtime/libkrun.1.17.0.dylib"
          printf '\0' >> \
            "$tampered_dir/a3s-oci-krun-runtime/libkrun.1.17.0.dylib"
          set +e
          tampered_output="$(
            "$tampered_dir/a3s-oci-krun-shim" context-smoke
          )"
          tampered_status=$?
          set -e
          printf '%s\n' "$tampered_output"
          test "$tampered_status" -eq 2
          jq --exit-status \
            '.status == "unavailable"
             and (.runtime_bundle_loaded | not)
             and (.context_created | not)
             and (.reason | contains("SHA-256 mismatch"))' \
            <<<"$tampered_output" >/dev/null
      - if: runner.os == 'macOS'
        name: Real libkrun guest marker or fail-closed entry
        shell: bash
        run: |
          rootfs_dir="$RUNNER_TEMP/a3s-oci-alpine-aarch64"
          rootfs_archive="$RUNNER_TEMP/alpine-minirootfs-3.22.5-aarch64.tar.gz"
          smoke_dir="$RUNNER_TEMP/a3s-oci-krun-vm"
          console="$RUNNER_TEMP/a3s-oci-krun-vm-console.log"
          system_image_manifest="$A3S_OCI_MACOS_SYSTEM_IMAGE_MANIFEST"
          mkdir -p "$rootfs_dir/run" "$smoke_dir"

          curl --fail --location --retry 3 \
            --output "$rootfs_archive" \
            https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/aarch64/alpine-minirootfs-3.22.5-aarch64.tar.gz
          printf '%s  %s\n' \
            '3fbc6285032ed46821b511292633d7b2a6306a2e254f590e92bdafff56cf2f70' \
            "$rootfs_archive" | shasum -a 256 --check

          cp target/debug/a3s-oci-krun-shim "$smoke_dir/"
          cp -R target/debug/a3s-oci-krun-runtime "$smoke_dir/"
          codesign --force --sign - \
            --entitlements packaging/macos/a3s-oci-hvf.entitlements \
            "$smoke_dir/a3s-oci-krun-shim"
          codesign --verify --strict "$smoke_dir/a3s-oci-krun-shim"

          set +e
          output="$(
            "$smoke_dir/a3s-oci-krun-shim" vm-smoke \
              --rootfs "$rootfs_dir" \
              --system-image-manifest "$system_image_manifest" \
              --runtime-share "$rootfs_dir" \
              --console "$console"
          )"
          status=$?
          set -e
          printf '%s\n' "$output"

          support="$(sysctl -n kern.hv_support 2>/dev/null || printf unavailable)"
          manifest_sha256="$(shasum -a 256 "$system_image_manifest" | awk '{print $1}')"
          if [[ "$support" == "1" ]]; then
            test "$status" -eq 0
            jq --exit-status --arg manifest_sha256 "$manifest_sha256" \
              '.platform == "macos" and .status == "available"
               and .runtime_bundle_loaded and .context_created
               and .vm_configured and .rootfs_configured
               and .runtime_share_configured
               and .macos_boot_assets.manifest_sha256 == $manifest_sha256
               and .macos_boot_assets.root_disk_read_only
               and .macos_boot_assets.runtime_share_separate
               and .workload_configured and .console_configured
               and .vm_entered and .guest_exit_code == 0
               and .marker_verified and .marker_removed
               and .console_created' \
              <<<"$output" >/dev/null
          else
            test "$status" -eq 2
            jq --exit-status \
              '.platform == "macos" and .status == "unavailable"
               and .runtime_bundle_loaded and .context_created
               and .vm_configured and .rootfs_configured
               and .workload_configured and .console_configured
               and (.vm_entered | not)
               and (.guest_exit_code == null)
               and (.marker_verified | not)
               and (.marker_removed | not)
               and (.reason | length > 0)' \
              <<<"$output" >/dev/null
          fi

          test -z "$(
            find "$rootfs_dir" -maxdepth 1 \
              -name '.a3s-oci-hvf-vm-smoke-*' -print -quit
          )"
      - if: runner.os == 'macOS'
        name: Authenticated macOS guest agent or fail-closed worker
        shell: bash
        run: |
          rootfs_dir="$RUNNER_TEMP/a3s-oci-alpine-aarch64"
          signed_dir="$RUNNER_TEMP/a3s-oci-agent-vm-signed"
          unsigned_dir="$RUNNER_TEMP/a3s-oci-agent-vm-unsigned"
          signed_console="$RUNNER_TEMP/a3s-oci-agent-vm-signed.log"
          unsigned_console="$RUNNER_TEMP/a3s-oci-agent-vm-unsigned.log"
          system_image_manifest="$A3S_OCI_MACOS_SYSTEM_IMAGE_MANIFEST"
          mkdir -p "$rootfs_dir/run" "$signed_dir" "$unsigned_dir"

          agent_version="$(
            cargo metadata --no-deps --format-version 1 |
              jq --raw-output \
                '.packages[] | select(.name == "a3s-oci-agent") | .version'
          )"

          cp target/debug/a3s-oci-krun-shim "$signed_dir/"
          cp -R target/debug/a3s-oci-krun-runtime "$signed_dir/"
          codesign --force --sign - \
            --entitlements packaging/macos/a3s-oci-hvf.entitlements \
            "$signed_dir/a3s-oci-krun-shim"
          codesign --verify --strict "$signed_dir/a3s-oci-krun-shim"

          endpoint_baseline="$(
            find /private/tmp -maxdepth 1 \
              -name 'a3s-oci-agent-*' -print | sort
          )"
          set +e
          output="$(
            target/debug/a3s-oci agent-vm-smoke \
              --shim "$signed_dir/a3s-oci-krun-shim" \
              --rootfs "$rootfs_dir" \
              --system-image-manifest "$system_image_manifest" \
              --console "$signed_console"
          )"
          status=$?
          set -e
          printf '%s\n' "$output"

          support="$(sysctl -n kern.hv_support 2>/dev/null || printf unavailable)"
          if [[ "$support" == "1" ]]; then
            test "$status" -eq 0
            jq --exit-status --arg agent_version "$agent_version" \
              '.schema_version == "a3s.oci.agent-vm-smoke.v9"
               and .platform == "macos" and .status == "available"
               and .endpoint_bound and .shim_spawned
               and (.endpoint_name | startswith("a3s-oci-agent-"))
               and (.shim_process_id > 0)
               and (.bridge_process_id > 0)
               and (.bridge_process_id != .shim_process_id)
               and .shim_client_verified and .protocol_negotiated
               and .selected_protocol == 10
               and .agent_version == $agent_version
               and .guest_architecture == "aarch64"
               and .advertised_operations
                   == ["create", "state", "start", "kill", "delete", "wait",
                       "exec", "signal-process", "wait-process", "pause",
                       "resume", "processes", "update", "stats",
                       "read-output", "write-stdin", "close-stdin", "resize",
                       "file", "filesystem", "acknowledge-operations"]
               and .shim_report_verified and .shim_exit_code == 0
               and .console_created
               and .shim_report.platform == "macos"
               and .shim_report.status == "available"
               and .shim_report.guest_exit_code == 0
               and .macos_cleanup.endpoint_removed
               and .macos_cleanup.shim_reaped
               and .macos_cleanup.bridge_reaped
               and (.macos_cleanup.open_descriptors_before > 0)
               and (.macos_cleanup.open_descriptors_before
                    == .macos_cleanup.open_descriptors_after)
               and .macos_cleanup.descriptor_inventory_restored
               and (.macos_cleanup.reason == null)' \
              <<<"$output" >/dev/null
          else
            test "$status" -eq 2
            jq --exit-status \
              '.schema_version == "a3s.oci.agent-vm-smoke.v9"
               and .platform == "macos" and .status == "unavailable"
               and (.endpoint_name | startswith("a3s-oci-agent-"))
               and (.protocol_negotiated | not)
               and (.shim_report_verified | not)
               and .macos_cleanup.endpoint_removed
               and .macos_cleanup.shim_reaped
               and .macos_cleanup.bridge_reaped
               and (.macos_cleanup.open_descriptors_before > 0)
               and (.macos_cleanup.open_descriptors_before
                    == .macos_cleanup.open_descriptors_after)
               and .macos_cleanup.descriptor_inventory_restored
               and (.macos_cleanup.reason == null)
               and (.reason | length > 0)' \
              <<<"$output" >/dev/null
          fi

          cp target/debug/a3s-oci-krun-shim "$unsigned_dir/"
          cp -R target/debug/a3s-oci-krun-runtime "$unsigned_dir/"
          set +e
          unsigned_output="$(
            target/debug/a3s-oci agent-vm-smoke \
              --shim "$unsigned_dir/a3s-oci-krun-shim" \
              --rootfs "$rootfs_dir" \
              --system-image-manifest "$system_image_manifest" \
              --console "$unsigned_console"
          )"
          unsigned_status=$?
          set -e
          printf '%s\n' "$unsigned_output"
          test "$unsigned_status" -eq 2
          jq --exit-status \
            '.schema_version == "a3s.oci.agent-vm-smoke.v9"
             and .platform == "macos" and .status == "unavailable"
             and .endpoint_bound and .shim_spawned
             and (.endpoint_name | startswith("a3s-oci-agent-"))
             and (.protocol_negotiated | not)
             and (.shim_report_verified | not)
             and .macos_cleanup.endpoint_removed
             and .macos_cleanup.shim_reaped
             and .macos_cleanup.bridge_reaped
             and (.macos_cleanup.open_descriptors_before > 0)
             and (.macos_cleanup.open_descriptors_before
                  == .macos_cleanup.open_descriptors_after)
             and .macos_cleanup.descriptor_inventory_restored
             and (.macos_cleanup.reason == null)
             and (.reason | length > 0)' \
            <<<"$unsigned_output" >/dev/null

          endpoint_after="$(
            find /private/tmp -maxdepth 1 \
              -name 'a3s-oci-agent-*' -print | sort
          )"
          test "$endpoint_after" = "$endpoint_baseline"
      - if: runner.os == 'macOS'
        name: Fixed macOS OCI lifecycle or fail-closed worker
        shell: bash
        run: |
          rootfs_dir="$RUNNER_TEMP/a3s-oci-alpine-aarch64"
          rootfs_archive="$RUNNER_TEMP/alpine-minirootfs-3.22.5-aarch64.tar.gz"
          signed_dir="$RUNNER_TEMP/a3s-oci-agent-vm-signed"
          unsigned_dir="$RUNNER_TEMP/a3s-oci-agent-vm-unsigned"
          bundle_dir="$rootfs_dir/var/lib/a3s-oci-smoke/bundle"
          container_rootfs="$bundle_dir/rootfs"
          marker="$container_rootfs/.a3s-oci-create-start-smoke"
          console="$RUNNER_TEMP/a3s-oci-fixed-lifecycle.log"
          unsigned_console="$RUNNER_TEMP/a3s-oci-fixed-lifecycle-unsigned.log"
          system_image_manifest="$A3S_OCI_MACOS_SYSTEM_IMAGE_MANIFEST"
          scripts/prepare-macos-utility-vm-bundle.sh \
            --alpine-archive "$rootfs_archive" \
            --config fixtures/utility-vm/config.json \
            --bundle "$bundle_dir"

          endpoint_baseline="$(
            find /private/tmp -maxdepth 1 \
              -name 'a3s-oci-agent-*' -print | sort
          )"
          set +e
          output="$(
            target/debug/a3s-oci oci-vm-smoke \
              --shim "$signed_dir/a3s-oci-krun-shim" \
              --vm-rootfs "$rootfs_dir" \
              --system-image-manifest "$system_image_manifest" \
              --bundle "$bundle_dir" \
              --console "$console"
          )"
          status=$?
          set -e
          printf '%s\n' "$output"

          support="$(sysctl -n kern.hv_support 2>/dev/null || printf unavailable)"
          if [[ "$support" == "1" ]]; then
            test "$status" -eq 0
            jq --exit-status \
              '.schema_version == "a3s.oci.oci-vm-smoke.v9"
               and .platform == "macos" and .status == "available"
               and .bundle_loaded
               and .create_returned_created and .create_replayed
               and (.created_pid > 0)
               and .marker_absent_after_create
               and .start_released and .running_observed
               and .processes_verified
               and .process_io_verified
               and .terminal_io_verified
               and .file_transfer_verified
               and .filesystem_operations_verified
               and .resources_updated and .stats_verified
               and .pause_froze_workload
               and .resume_advanced_workload
               and .kill_delivered and .kill_replayed
               and .wait_timeout_enforced
               and .wait_exit_status
                   == {"exit_code": 0, "oom_killed": false}
               and .wait_replayed
               and .stopped_observed and .marker_verified
               and .delete_succeeded and .delete_replayed
               and .state_missing_after_delete
               and .marker_removed and .guest_runtime_clean
               and .bridge.platform == "macos"
               and .bridge.status == "available"
               and .bridge.endpoint_bound and .bridge.shim_spawned
               and (.bridge.endpoint_name
                    | startswith("a3s-oci-agent-"))
               and (.bridge.shim_process_id > 0)
               and (.bridge.bridge_process_id > 0)
               and (.bridge.bridge_process_id
                    != .bridge.shim_process_id)
               and .bridge.shim_client_verified
               and .bridge.protocol_negotiated
               and .bridge.selected_protocol == 10
               and .bridge.guest_architecture == "aarch64"
               and .bridge.advertised_operations
                   == ["create", "state", "start", "kill", "delete", "wait",
                       "exec", "signal-process", "wait-process", "pause",
                       "resume", "processes", "update", "stats",
                       "read-output", "write-stdin", "close-stdin", "resize",
                       "file", "filesystem", "acknowledge-operations"]
               and .bridge.shim_report_verified
               and .bridge.shim_exit_code == 0
               and .bridge.console_created
               and .bridge.macos_cleanup.endpoint_removed
               and .bridge.macos_cleanup.shim_reaped
               and .bridge.macos_cleanup.bridge_reaped
               and (.bridge.macos_cleanup.open_descriptors_before > 0)
               and (.bridge.macos_cleanup.open_descriptors_before
                    == .bridge.macos_cleanup.open_descriptors_after)
               and .bridge.macos_cleanup.descriptor_inventory_restored
               and (.bridge.macos_cleanup.reason == null)' \
              <<<"$output" >/dev/null
          else
            test "$status" -eq 2
            jq --exit-status \
              '.schema_version == "a3s.oci.oci-vm-smoke.v9"
               and .platform == "macos" and .status == "unavailable"
               and .bundle_loaded
               and .bridge.platform == "macos"
               and .bridge.status == "unavailable"
               and (.bridge.endpoint_name
                    | startswith("a3s-oci-agent-"))
               and (.bridge.protocol_negotiated | not)
               and .bridge.macos_cleanup.endpoint_removed
               and .bridge.macos_cleanup.shim_reaped
               and .bridge.macos_cleanup.bridge_reaped
               and (.bridge.macos_cleanup.open_descriptors_before > 0)
               and (.bridge.macos_cleanup.open_descriptors_before
                    == .bridge.macos_cleanup.open_descriptors_after)
               and .bridge.macos_cleanup.descriptor_inventory_restored
               and (.bridge.macos_cleanup.reason == null)
               and (.reason | length > 0)' \
              <<<"$output" >/dev/null
          fi

          set +e
          unsigned_output="$(
            target/debug/a3s-oci oci-vm-smoke \
              --shim "$unsigned_dir/a3s-oci-krun-shim" \
              --vm-rootfs "$rootfs_dir" \
              --system-image-manifest "$system_image_manifest" \
              --bundle "$bundle_dir" \
              --console "$unsigned_console"
          )"
          unsigned_status=$?
          set -e
          printf '%s\n' "$unsigned_output"
          test "$unsigned_status" -eq 2
          jq --exit-status \
            '.schema_version == "a3s.oci.oci-vm-smoke.v9"
             and .platform == "macos" and .status == "unavailable"
             and .bundle_loaded
             and (.create_returned_created | not)
             and .bridge.platform == "macos"
             and .bridge.status == "unavailable"
             and .bridge.endpoint_bound and .bridge.shim_spawned
             and (.bridge.endpoint_name
                  | startswith("a3s-oci-agent-"))
             and (.bridge.protocol_negotiated | not)
             and (.bridge.shim_report_verified | not)
             and .bridge.macos_cleanup.endpoint_removed
             and .bridge.macos_cleanup.shim_reaped
             and .bridge.macos_cleanup.bridge_reaped
             and (.bridge.macos_cleanup.open_descriptors_before > 0)
             and (.bridge.macos_cleanup.open_descriptors_before
                  == .bridge.macos_cleanup.open_descriptors_after)
             and .bridge.macos_cleanup.descriptor_inventory_restored
             and (.bridge.macos_cleanup.reason == null)
             and (.reason | length > 0)' \
            <<<"$unsigned_output" >/dev/null

          endpoint_after="$(
            find /private/tmp -maxdepth 1 \
              -name 'a3s-oci-agent-*' -print | sort
          )"
          test "$endpoint_after" = "$endpoint_baseline"
          test ! -e "$marker"
      - if: runner.os == 'macOS'
        name: Multi-container macOS OCI lifecycle or fail-closed worker
        shell: bash
        run: |
          rootfs_dir="$RUNNER_TEMP/a3s-oci-alpine-aarch64"
          rootfs_archive="$RUNNER_TEMP/alpine-minirootfs-3.22.5-aarch64.tar.gz"
          signed_dir="$RUNNER_TEMP/a3s-oci-agent-vm-signed"
          bundle_a="$rootfs_dir/var/lib/a3s-oci-smoke/bundle"
          bundle_b="$rootfs_dir/var/lib/a3s-oci-smoke/bundle-b"
          marker_a="$bundle_a/rootfs/.a3s-oci-create-start-smoke"
          marker_b="$bundle_b/rootfs/.a3s-oci-create-start-smoke"
          console="$RUNNER_TEMP/a3s-oci-multi-container.log"
          system_image_manifest="$A3S_OCI_MACOS_SYSTEM_IMAGE_MANIFEST"
          scripts/prepare-macos-utility-vm-bundle.sh \
            --alpine-archive "$rootfs_archive" \
            --config fixtures/utility-vm/config.json \
            --bundle "$bundle_b" \
            --cgroups-path a3s-oci-smoke-b

          endpoint_baseline="$(
            find /private/tmp -maxdepth 1 \
              -name 'a3s-oci-agent-*' -print | sort
          )"
          runtime_baseline="$(
            find "$rootfs_dir/run" -maxdepth 1 \
              -name 'a3s-oci-agent-*' -print | sort
          )"
          set +e
          output="$(
            target/debug/a3s-oci oci-vm-multi-container-smoke \
              --shim "$signed_dir/a3s-oci-krun-shim" \
              --vm-rootfs "$rootfs_dir" \
              --system-image-manifest "$system_image_manifest" \
              --bundle-a "$bundle_a" \
              --bundle-b "$bundle_b" \
              --console "$console"
          )"
          status=$?
          set -e
          printf '%s\n' "$output"

          support="$(sysctl -n kern.hv_support 2>/dev/null || printf unavailable)"
          if [[ "$support" == "1" ]]; then
            test "$status" -eq 0
            jq --exit-status \
              '.schema_version == "a3s.oci.oci-vm-multi-container-smoke.v11"
               and .platform == "macos" and .status == "available"
               and .bundles_loaded
               and .lifecycle.distinct_bundle_directories
               and .lifecycle.distinct_rootfs_directories
               and .lifecycle.both_created_before_start
               and .lifecycle.initial_generation_a == 1
               and .lifecycle.initial_generation_b == 1
               and .lifecycle.recreated_generation_a == 2
               and (.lifecycle.created_pid_a > 0)
               and (.lifecycle.created_pid_b > 0)
               and .lifecycle.distinct_created_pids
               and .lifecycle.create_replays_exact
               and .lifecycle.both_markers_absent_before_start
               and .lifecycle.start_a_replayed
               and .lifecycle.marker_a_verified
               and .lifecycle.b_unchanged_after_a_start
               and .lifecycle.marker_b_absent_after_a_start
               and .lifecycle.wait_a_did_not_block_b
               and .lifecycle.kill_a_replayed
               and .lifecycle.a_stopped
               and .lifecycle.wait_status_a
                   == {"exit_code": 0, "oom_killed": false}
               and .lifecycle.wait_a_replayed
               and .lifecycle.b_unchanged_after_a_kill
               and .lifecycle.marker_b_absent_after_a_kill
               and .lifecycle.delete_a_replayed
               and .lifecycle.a_missing_after_delete
               and .lifecycle.b_unchanged_after_a_delete
               and .lifecycle.stale_generation_rejected
               and .lifecycle.generation_a_monotonic
               and .lifecycle.recreate_a_replayed
               and .lifecycle.marker_a_absent_after_recreate
               and .lifecycle.cross_container_operation_rejected
               and .lifecycle.b_unchanged_after_replay_conflict
               and .lifecycle.recreated_a_deleted
               and .lifecycle.start_b_replayed
               and .lifecycle.marker_b_verified
               and .lifecycle.kill_b_replayed
               and .lifecycle.b_stopped
               and .lifecycle.wait_status_b
                   == {"exit_code": 0, "oom_killed": false}
               and .lifecycle.wait_b_replayed
               and .lifecycle.delete_b_replayed
               and .lifecycle.b_missing_after_delete
               and (.namespace_join.donor_pid > 0)
               and .namespace_join.wrong_type_rejected_before_state
               and .namespace_join.joined_non_mount_namespaces
               and .namespace_join.joined_pid_time_workload_verified
               and .namespace_join.joined_user_default_devices_verified
               and .namespace_join.joined_mount_namespace
               and .namespace_join.retained_rootfs_verified
               and .namespace_join.donor_unchanged_after_joins
               and .namespace_join.all_state_removed
               and .rootfs_mount.created_before_start
               and .rootfs_mount.mount_targets_created_before_start
               and .rootfs_mount.evidence_absent_before_start
               and .rootfs_mount.start_released
               and .rootfs_mount.dev_symlinks_verified
               and .rootfs_mount.rootfs_propagation_shared
               and .rootfs_mount.readonly_path_enforced
               and .rootfs_mount.masked_path_enforced
               and .rootfs_mount.recursive_mount_attributes_enforced
               and .rootfs_mount.idmapped_mounts_enforced
               and .rootfs_mount.readonly_rootfs_enforced
               and .rootfs_mount.exact_evidence
               and .rootfs_mount.wait_status
                   == {"exit_code": 0, "oom_killed": false}
               and .rootfs_mount.state_removed
               and .rootfs_mount.artifacts_removed
               and .pid_supervision.pid1_supervision_enforced
               and .pid_supervision.orphan_reaping_enforced
               and .markers_removed and .guest_runtime_clean
               and .bridge.platform == "macos"
               and .bridge.status == "available"
               and .bridge.protocol_negotiated
               and .bridge.selected_protocol == 10
               and .bridge.advertised_operations
                   == ["create", "state", "start", "kill", "delete", "wait",
                       "exec", "signal-process", "wait-process", "pause",
                       "resume", "processes", "update", "stats",
                       "read-output", "write-stdin", "close-stdin", "resize",
                       "file", "filesystem", "acknowledge-operations"]
               and .bridge.shim_report_verified
               and .bridge.shim_exit_code == 0
               and .bridge.macos_cleanup.endpoint_removed
               and .bridge.macos_cleanup.shim_reaped
               and .bridge.macos_cleanup.bridge_reaped
               and (.bridge.macos_cleanup.open_descriptors_before > 0)
               and (.bridge.macos_cleanup.open_descriptors_before
                    == .bridge.macos_cleanup.open_descriptors_after)
               and .bridge.macos_cleanup.descriptor_inventory_restored
               and (.bridge.macos_cleanup.reason == null)
               and (.reason == null)' \
              <<<"$output" >/dev/null
          else
            test "$status" -eq 2
            jq --exit-status \
              '.schema_version == "a3s.oci.oci-vm-multi-container-smoke.v11"
               and .platform == "macos" and .status == "unavailable"
               and .bundles_loaded
               and .bridge.platform == "macos"
               and .bridge.status == "unavailable"
               and (.bridge.protocol_negotiated | not)
               and .bridge.macos_cleanup.endpoint_removed
               and .bridge.macos_cleanup.shim_reaped
               and .bridge.macos_cleanup.bridge_reaped
               and (.bridge.macos_cleanup.open_descriptors_before > 0)
               and (.bridge.macos_cleanup.open_descriptors_before
                    == .bridge.macos_cleanup.open_descriptors_after)
               and .bridge.macos_cleanup.descriptor_inventory_restored
               and (.bridge.macos_cleanup.reason == null)
               and (.reason | length > 0)' \
              <<<"$output" >/dev/null
          fi

          endpoint_after="$(
            find /private/tmp -maxdepth 1 \
              -name 'a3s-oci-agent-*' -print | sort
          )"
          runtime_after="$(
            find "$rootfs_dir/run" -maxdepth 1 \
              -name 'a3s-oci-agent-*' -print | sort
          )"
          test "$endpoint_after" = "$endpoint_baseline"
          test "$runtime_after" = "$runtime_baseline"
          test ! -e "$marker_a"
          test ! -e "$marker_b"
      - if: runner.os == 'macOS'
        name: Repeated macOS HVF utility-VM soak
        shell: bash
        timeout-minutes: 90
        run: |
          rootfs_dir="$RUNNER_TEMP/a3s-oci-alpine-aarch64"
          signed_dir="$RUNNER_TEMP/a3s-oci-agent-vm-signed"
          bundle_a="$rootfs_dir/var/lib/a3s-oci-smoke/bundle"
          bundle_b="$rootfs_dir/var/lib/a3s-oci-smoke/bundle-b"
          marker_a="$bundle_a/rootfs/.a3s-oci-create-start-smoke"
          marker_b="$bundle_b/rootfs/.a3s-oci-create-start-smoke"
          console_dir="$RUNNER_TEMP/a3s-oci-macos-hvf-soak-consoles"
          report="$RUNNER_TEMP/a3s-oci-macos-hvf-soak.json"
          system_image_manifest="$A3S_OCI_MACOS_SYSTEM_IMAGE_MANIFEST"
          iterations=25
          mkdir -p "$console_dir"

          endpoint_baseline="$(
            find /private/tmp -maxdepth 1 \
              -name 'a3s-oci-agent-*' -print | sort
          )"
          runtime_baseline="$(
            find "$rootfs_dir/run" -maxdepth 1 \
              -name 'a3s-oci-agent-*' -print | sort
          )"
          set +e
          output="$(
            target/debug/a3s-oci macos-hvf-soak \
              --shim "$signed_dir/a3s-oci-krun-shim" \
              --vm-rootfs "$rootfs_dir" \
              --system-image-manifest "$system_image_manifest" \
              --bundle-a "$bundle_a" \
              --bundle-b "$bundle_b" \
              --console-dir "$console_dir" \
              --iterations "$iterations"
          )"
          status=$?
          set -e
          printf '%s\n' "$output" | tee "$report"

          support="$(sysctl -n kern.hv_support 2>/dev/null || printf unavailable)"
          architecture="$(uname -m)"
          if [[ "$architecture" == "arm64" && "$support" == "1" ]]; then
            test "$status" -eq 0
            jq --exit-status --argjson iterations "$iterations" \
              '.schema_version == "a3s.oci.macos-hvf-soak.v1"
               and .platform == "macos" and .status == "available"
               and .configuration.iterations == $iterations
               and .configuration.concurrent_containers == 2
               and .completed_iterations == $iterations
               and .completed_vm_lifecycles == $iterations
               and .completed_primary_container_generations
                   == ($iterations * 3)
               and .lifecycle_verified_every_iteration
               and .namespace_join_verified_every_iteration
               and .rootfs_mount_verified_every_iteration
               and .pid_supervision_verified_every_iteration
               and .markers_removed_every_iteration
               and .guest_runtime_clean_every_iteration
               and .host_cleanup_verified_every_iteration
               and .unique_endpoint_names
               and (.steady_open_descriptors > 0)
               and .final_open_descriptors == .steady_open_descriptors
               and .descriptor_count_stable
               and .console_files_created == $iterations
               and (.failure_iteration == null)
               and (.reason == null)' \
              "$report" >/dev/null
            test "$(
              find "$console_dir" -maxdepth 1 -type f \
                -name 'macos-hvf-soak-*.log' | wc -l | tr -d ' '
            )" -eq "$iterations"
          elif [[ "$architecture" == "arm64" ]]; then
            test "$status" -eq 2
            jq --exit-status --argjson iterations "$iterations" \
              '.schema_version == "a3s.oci.macos-hvf-soak.v1"
               and .platform == "macos" and .status == "unavailable"
               and .configuration.iterations == $iterations
               and .configuration.concurrent_containers == 2
               and .completed_iterations == 0
               and .completed_vm_lifecycles == 0
               and .completed_primary_container_generations == 0
               and .failure_iteration == 1
               and (.reason | length > 0)' \
              "$report" >/dev/null
          else
            test "$status" -eq 2
            jq --exit-status --argjson iterations "$iterations" \
              '.schema_version == "a3s.oci.macos-hvf-soak.v1"
               and .platform == "macos" and .status == "unsupported"
               and .configuration.iterations == $iterations
               and .configuration.concurrent_containers == 2
               and .completed_iterations == 0
               and (.failure_iteration == null)
               and (.reason | length > 0)' \
              "$report" >/dev/null
          fi

          endpoint_after="$(
            find /private/tmp -maxdepth 1 \
              -name 'a3s-oci-agent-*' -print | sort
          )"
          runtime_after="$(
            find "$rootfs_dir/run" -maxdepth 1 \
              -name 'a3s-oci-agent-*' -print | sort
          )"
          test "$endpoint_after" = "$endpoint_baseline"
          test "$runtime_after" = "$runtime_baseline"
          test ! -e "$marker_a"
          test ! -e "$marker_b"
      - if: runner.os == 'macOS' && always()
        name: Upload macOS HVF soak evidence
        uses: actions/upload-artifact@v4
        with:
          name: macos-hvf-soak-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/a3s-oci-macos-hvf-soak.json
            ${{ runner.temp }}/a3s-oci-macos-hvf-soak-consoles
          if-no-files-found: warn
          retention-days: 14
      - if: runner.os == 'macOS'
        name: Real macOS lifecycle and transport fault cleanup
        run: bash .github/scripts/macos-fault-cleanup.sh
      - if: runner.os == 'macOS'
        name: Real macOS operation reopen and owner replacement with HVF
        run: bash .github/scripts/macos-reopen-replacement.sh
      - if: runner.os == 'Linux'
        name: Rootless generated-cgroup device boundary
        env:
          A3S_OCI_NATIVE_FOCUS: rootless-device-boundary
        run: bash .github/scripts/native-linux-smoke.sh
      - if: runner.os == 'Linux'
        name: Native Linux SDK lifecycle without KVM
        env:
          A3S_OCI_NATIVE_SOAK_REPORT: ${{ runner.temp }}/a3s-oci-native-soak.json
          A3S_OCI_NATIVE_RECOVERY_REPORT: ${{ runner.temp }}/a3s-oci-native-recovery.json
          A3S_OCI_NATIVE_ROOTLESS_RECOVERY_REPORT: ${{ runner.temp }}/a3s-oci-native-rootless-recovery.json
          A3S_OCI_NATIVE_ROOTLESS_DEVICE_POLICY_REPORT: ${{ runner.temp }}/a3s-oci-native-rootless-device-policy.json
        run: bash .github/scripts/native-linux-smoke.sh
      - if: runner.os == 'Linux' && always()
        name: Upload native Linux soak evidence
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-soak-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/a3s-oci-native-soak.json
            ${{ runner.temp }}/a3s-oci-native-recovery.json
            ${{ runner.temp }}/a3s-oci-native-rootless-recovery.json
            ${{ runner.temp }}/a3s-oci-native-rootless-device-policy.json
          if-no-files-found: warn
          retention-days: 14
      - if: runner.os == 'Windows'
        name: Verify Windows libkrun context
        run: cargo run -p a3s-oci-krun --bin a3s-oci-krun-shim -- context-smoke
      - if: runner.os == 'Windows'
        name: Stage Windows WHPX qualification binaries
        shell: pwsh
        env:
          A3S_QUALIFICATION_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'a3s-oci-windows-whpx-qualification'
          if (Test-Path -LiteralPath $stage) {
            throw "Refusing to reuse qualification artifact directory: $stage"
          }
          $bin = Join-Path $stage 'bin'
          $systemImage = Join-Path $stage 'system-image'
          New-Item -ItemType Directory -Path $bin, $systemImage | Out-Null

          $sources = @(
            'target\debug\a3s-oci.exe',
            'target\debug\a3s-oci-krun-shim.exe',
            'target\debug\krun.dll',
            'target\debug\libkrunfw.dll'
          )
          foreach ($source in $sources) {
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Missing Windows qualification binary: $source"
            }
            Copy-Item -LiteralPath $source -Destination $bin
          }

          $systemImageManifest = $env:A3S_OCI_WINDOWS_SYSTEM_IMAGE_MANIFEST
          $systemImageSource = Split-Path -Parent $systemImageManifest
          foreach ($name in @(
            'system-image.json',
            'a3s-oci-system.ext4',
            'a3s-oci-system.ext4.xz'
          )) {
            Copy-Item -LiteralPath (Join-Path $systemImageSource $name) `
              -Destination $systemImage
          }
          $decoded = Get-Content -LiteralPath `
            (Join-Path $systemImage 'system-image.json') -Raw | ConvertFrom-Json
          $krunSha256 = (
            Get-FileHash -LiteralPath (Join-Path $bin 'krun.dll') -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          $firmwareSha256 = (
            Get-FileHash -LiteralPath (Join-Path $bin 'libkrunfw.dll') -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          if ($decoded.runtime.krun_dll.sha256 -ne $krunSha256 -or
              $decoded.runtime.firmware.sha256 -ne $firmwareSha256) {
            throw 'Windows runtime DLLs do not match the immutable system-image manifest.'
          }

          $files = @(
            Get-ChildItem -LiteralPath $stage -File -Recurse |
              Sort-Object FullName |
              ForEach-Object {
                [ordered]@{
                  name = [IO.Path]::GetRelativePath($stage, $_.FullName).Replace('\', '/')
                  size = $_.Length
                  sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                }
              }
          )
          $manifest = [ordered]@{
            schema_version = 'a3s.oci.windows-whpx-qualification-artifact.v2'
            source_commit = $env:A3S_QUALIFICATION_SOURCE_COMMIT
            workflow_commit = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            files = $files
          }
          $json = ConvertTo-Json -InputObject $manifest -Depth 5
          [IO.File]::WriteAllText(
            (Join-Path $stage 'artifact-manifest.json'),
            $json,
            (New-Object System.Text.UTF8Encoding($false))
          )
      - if: runner.os == 'Windows'
        name: Upload Windows WHPX qualification binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-whpx-qualification
          path: ${{ runner.temp }}/a3s-oci-windows-whpx-qualification
          if-no-files-found: error
          retention-days: 14

  native-linux-arm64:
    name: native-linux-lifecycle (aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux libkrun runtime integrity and context lifecycle
        run: |
          cargo test -p a3s-oci-krun --all-targets
          cargo run -p a3s-oci-krun --bin a3s-oci-krun-shim -- context-smoke
      - name: Rootless generated-cgroup device boundary
        env:
          A3S_OCI_NATIVE_FOCUS: rootless-device-boundary
        run: bash .github/scripts/native-linux-smoke.sh
      - name: Native Linux SDK lifecycle without KVM
        env:
          A3S_OCI_NATIVE_SOAK_REPORT: ${{ runner.temp }}/a3s-oci-native-soak.json
          A3S_OCI_NATIVE_RECOVERY_REPORT: ${{ runner.temp }}/a3s-oci-native-recovery.json
          A3S_OCI_NATIVE_ROOTLESS_RECOVERY_REPORT: ${{ runner.temp }}/a3s-oci-native-rootless-recovery.json
          A3S_OCI_NATIVE_ROOTLESS_DEVICE_POLICY_REPORT: ${{ runner.temp }}/a3s-oci-native-rootless-device-policy.json
        run: bash .github/scripts/native-linux-smoke.sh
      - if: always()
        name: Upload native Linux soak evidence
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-soak-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/a3s-oci-native-soak.json
            ${{ runner.temp }}/a3s-oci-native-recovery.json
            ${{ runner.temp }}/a3s-oci-native-rootless-recovery.json
            ${{ runner.temp }}/a3s-oci-native-rootless-device-policy.json
          if-no-files-found: warn
          retention-days: 14

  guest-agent-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Build static guest agents
        run: .github/scripts/build-static-guest-agents.sh
      - name: Verify static guest artifact
        shell: bash
        run: |
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            agent="target/$target/release/a3s-oci-agent"
            file "$agent"
            if readelf --program-headers "$agent" | grep --quiet INTERP; then
              echo "$agent contains a dynamic interpreter" >&2
              exit 1
            fi
            if readelf --dynamic "$agent" | grep --quiet NEEDED; then
              echo "$agent contains a dynamic dependency" >&2
              exit 1
            fi
          done
      - name: Build reproducible immutable macOS system image
        shell: bash
        run: |
          alpine="$RUNNER_TEMP/alpine-minirootfs-3.22.5-aarch64.tar.gz"
          output="$RUNNER_TEMP/a3s-oci-macos-system-image"
          curl --fail --location --retry 3 \
            --output "$alpine" \
            https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/aarch64/alpine-minirootfs-3.22.5-aarch64.tar.gz
          bash scripts/build-macos-system-image.sh \
            --alpine-archive "$alpine" \
            --agent target/aarch64-unknown-linux-musl/release/a3s-oci-agent \
            --output-dir "$output" \
            --reproducibility-delay 1
          test "$(jq --raw-output '.image.sha256' "$output/system-image.json")" = "$(sha256sum "$output/a3s-oci-system.ext4" | cut -d ' ' -f 1)"
          test "$(jq --raw-output '.image.archive_sha256' "$output/system-image.json")" = "$(sha256sum "$output/a3s-oci-system.ext4.xz" | cut -d ' ' -f 1)"
      - name: Upload immutable macOS system image
        uses: actions/upload-artifact@v4
        with:
          name: macos-system-image
          path: ${{ runner.temp }}/a3s-oci-macos-system-image
          if-no-files-found: error
          retention-days: 14
      - name: Build reproducible immutable Windows system image
        shell: bash
        run: |
          alpine="$RUNNER_TEMP/alpine-minirootfs-3.22.5-x86_64.tar.gz"
          output="$RUNNER_TEMP/a3s-oci-windows-system-image"
          curl --fail --location --retry 3 \
            --output "$alpine" \
            https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/x86_64/alpine-minirootfs-3.22.5-x86_64.tar.gz
          bash scripts/build-windows-system-image.sh \
            --alpine-archive "$alpine" \
            --agent target/x86_64-unknown-linux-musl/release/a3s-oci-agent \
            --output-dir "$output" \
            --reproducibility-delay 1
          test "$(jq --raw-output '.image.sha256' "$output/system-image.json")" = "$(sha256sum "$output/a3s-oci-system.ext4" | cut -d ' ' -f 1)"
          test "$(jq --raw-output '.image.archive_sha256' "$output/system-image.json")" = "$(sha256sum "$output/a3s-oci-system.ext4.xz" | cut -d ' ' -f 1)"
          test "$(jq --raw-output '.runtime.sources.kernel_version' "$output/system-image.json")" = '6.12.91'
      - name: Upload immutable Windows system image
        uses: actions/upload-artifact@v4
        with:
          name: windows-system-image
          path: ${{ runner.temp }}/a3s-oci-windows-system-image
          if-no-files-found: error
          retention-days: 14
      - name: Stage static guest qualification artifacts
        shell: bash
        env:
          A3S_QUALIFICATION_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          stage="$RUNNER_TEMP/a3s-oci-guest-agents"
          test ! -e "$stage"
          mkdir -p "$stage"
          install -m 0755 \
            target/x86_64-unknown-linux-musl/release/a3s-oci-agent \
            "$stage/a3s-oci-agent-x86_64"
          install -m 0755 \
            target/aarch64-unknown-linux-musl/release/a3s-oci-agent \
            "$stage/a3s-oci-agent-aarch64"

          x86_sha="$(sha256sum "$stage/a3s-oci-agent-x86_64" | cut -d ' ' -f 1)"
          arm_sha="$(sha256sum "$stage/a3s-oci-agent-aarch64" | cut -d ' ' -f 1)"
          jq --null-input \
            --arg schema_version 'a3s.oci.guest-agent-qualification-artifact.v1' \
            --arg source_commit "$A3S_QUALIFICATION_SOURCE_COMMIT" \
            --arg workflow_commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg x86_sha "$x86_sha" \
            --arg arm_sha "$arm_sha" \
            --argjson x86_size "$(stat --format '%s' "$stage/a3s-oci-agent-x86_64")" \
            --argjson arm_size "$(stat --format '%s' "$stage/a3s-oci-agent-aarch64")" \
            '{
              schema_version: $schema_version,
              source_commit: $source_commit,
              workflow_commit: $workflow_commit,
              run_id: $run_id,
              run_attempt: $run_attempt,
              files: [
                {name: "a3s-oci-agent-x86_64", size: $x86_size, sha256: $x86_sha},
                {name: "a3s-oci-agent-aarch64", size: $arm_size, sha256: $arm_sha}
              ]
            }' > "$stage/artifact-manifest.json"
      - name: Upload static guest qualification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: guest-agents-musl
          path: ${{ runner.temp }}/a3s-oci-guest-agents
          if-no-files-found: error
          retention-days: 14
