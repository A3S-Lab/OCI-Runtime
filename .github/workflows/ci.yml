name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Exhaustive durable-state and host-driver fault matrix
        run: cargo test -p a3s-oci-runtime fault_matrix
      - run: cargo test --workspace --all-targets
      - run: cargo run -p a3s-oci-cli -- features
      - if: runner.os == 'macOS'
        name: Hypervisor.framework VM object lifecycle
        shell: bash
        run: |
          smoke="$RUNNER_TEMP/a3s-oci-hvf-smoke"
          cp target/debug/a3s-oci "$smoke"
          codesign --force --sign - \
            --entitlements packaging/macos/a3s-oci-hvf.entitlements \
            "$smoke"
          codesign --verify --strict "$smoke"

          set +e
          output="$("$smoke" hvf-smoke)"
          status=$?
          set -e
          printf '%s\n' "$output"

          support="$(sysctl -n kern.hv_support 2>/dev/null || printf unavailable)"
          if [[ "$support" == "1" ]]; then
            test "$status" -eq 0
            jq --exit-status \
              '.status == "available" and .vm_created and .vm_destroyed' \
              <<<"$output" >/dev/null
          else
            test "$status" -eq 2
            jq --exit-status \
              '.status == "unavailable" and (.vm_created | not) and (.vm_destroyed | not)' \
              <<<"$output" >/dev/null
          fi
      - if: runner.os == 'macOS'
        name: Isolated libkrun context lifecycle
        shell: bash
        run: |
          smoke_dir="$RUNNER_TEMP/a3s-oci-krun-context"
          mkdir -p "$smoke_dir"
          cp target/debug/a3s-oci-krun-shim "$smoke_dir/"
          cp -R target/debug/a3s-oci-krun-runtime "$smoke_dir/"

          codesign --verify --strict \
            "$smoke_dir/a3s-oci-krun-runtime/libkrun.1.17.0.dylib"
          codesign --verify --strict \
            "$smoke_dir/a3s-oci-krun-runtime/libkrunfw.5.dylib"
          codesign --force --sign - \
            --entitlements packaging/macos/a3s-oci-hvf.entitlements \
            "$smoke_dir/a3s-oci-krun-shim"
          codesign --verify --strict "$smoke_dir/a3s-oci-krun-shim"

          output="$("$smoke_dir/a3s-oci-krun-shim" context-smoke)"
          printf '%s\n' "$output"
          jq --exit-status \
            '.platform == "macos" and .status == "available"
             and .runtime_bundle_loaded and .context_created
             and .vm_configured and .agent_vsock_configured
             and .context_released' \
            <<<"$output" >/dev/null

          tampered_dir="$RUNNER_TEMP/a3s-oci-krun-context-tampered"
          cp -R "$smoke_dir" "$tampered_dir"
          chmod u+w \
            "$tampered_dir/a3s-oci-krun-runtime/libkrun.1.17.0.dylib"
          printf '\0' >> \
            "$tampered_dir/a3s-oci-krun-runtime/libkrun.1.17.0.dylib"
          set +e
          tampered_output="$(
            "$tampered_dir/a3s-oci-krun-shim" context-smoke
          )"
          tampered_status=$?
          set -e
          printf '%s\n' "$tampered_output"
          test "$tampered_status" -eq 2
          jq --exit-status \
            '.status == "unavailable"
             and (.runtime_bundle_loaded | not)
             and (.context_created | not)
             and (.reason | contains("SHA-256 mismatch"))' \
            <<<"$tampered_output" >/dev/null
      - if: runner.os == 'macOS'
        name: Real libkrun guest marker or fail-closed entry
        shell: bash
        run: |
          rootfs_dir="$RUNNER_TEMP/a3s-oci-alpine-aarch64"
          rootfs_archive="$RUNNER_TEMP/alpine-minirootfs-3.22.5-aarch64.tar.gz"
          smoke_dir="$RUNNER_TEMP/a3s-oci-krun-vm"
          console="$RUNNER_TEMP/a3s-oci-krun-vm-console.log"
          mkdir -p "$rootfs_dir" "$smoke_dir"

          curl --fail --location --retry 3 \
            --output "$rootfs_archive" \
            https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/aarch64/alpine-minirootfs-3.22.5-aarch64.tar.gz
          printf '%s  %s\n' \
            '3fbc6285032ed46821b511292633d7b2a6306a2e254f590e92bdafff56cf2f70' \
            "$rootfs_archive" | shasum -a 256 --check
          tar -xzf "$rootfs_archive" -C "$rootfs_dir"

          cp target/debug/a3s-oci-krun-shim "$smoke_dir/"
          cp -R target/debug/a3s-oci-krun-runtime "$smoke_dir/"
          codesign --force --sign - \
            --entitlements packaging/macos/a3s-oci-hvf.entitlements \
            "$smoke_dir/a3s-oci-krun-shim"
          codesign --verify --strict "$smoke_dir/a3s-oci-krun-shim"

          set +e
          output="$(
            "$smoke_dir/a3s-oci-krun-shim" vm-smoke \
              --rootfs "$rootfs_dir" \
              --console "$console"
          )"
          status=$?
          set -e
          printf '%s\n' "$output"

          support="$(sysctl -n kern.hv_support 2>/dev/null || printf unavailable)"
          if [[ "$support" == "1" ]]; then
            test "$status" -eq 0
            jq --exit-status \
              '.platform == "macos" and .status == "available"
               and .runtime_bundle_loaded and .context_created
               and .vm_configured and .rootfs_configured
               and .workload_configured and .console_configured
               and .vm_entered and .guest_exit_code == 0
               and .marker_verified and .marker_removed
               and .console_created' \
              <<<"$output" >/dev/null
          else
            test "$status" -eq 2
            jq --exit-status \
              '.platform == "macos" and .status == "unavailable"
               and .runtime_bundle_loaded and .context_created
               and .vm_configured and .rootfs_configured
               and .workload_configured and .console_configured
               and (.vm_entered | not)
               and (.guest_exit_code == null)
               and (.marker_verified | not)
               and (.marker_removed | not)
               and (.reason | length > 0)' \
              <<<"$output" >/dev/null
          fi

          test -z "$(
            find "$rootfs_dir" -maxdepth 1 \
              -name '.a3s-oci-hvf-vm-smoke-*' -print -quit
          )"
      - if: runner.os == 'macOS'
        name: Authenticated macOS guest agent or fail-closed worker
        shell: bash
        run: |
          rootfs_dir="$RUNNER_TEMP/a3s-oci-alpine-aarch64"
          signed_dir="$RUNNER_TEMP/a3s-oci-agent-vm-signed"
          unsigned_dir="$RUNNER_TEMP/a3s-oci-agent-vm-unsigned"
          signed_console="$RUNNER_TEMP/a3s-oci-agent-vm-signed.log"
          unsigned_console="$RUNNER_TEMP/a3s-oci-agent-vm-unsigned.log"
          mkdir -p "$rootfs_dir/usr/bin" "$signed_dir" "$unsigned_dir"

          rustup target add aarch64-unknown-linux-musl
          host_triple="$(rustc -vV | sed -n 's/^host: //p')"
          rust_lld="$(
            rustc --print sysroot
          )/lib/rustlib/$host_triple/bin/rust-lld"
          test -x "$rust_lld"
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER="$rust_lld" \
            cargo build -p a3s-oci-agent --release \
              --target aarch64-unknown-linux-musl
          agent=target/aarch64-unknown-linux-musl/release/a3s-oci-agent
          agent_version="$(
            cargo metadata --no-deps --format-version 1 |
              jq --raw-output \
                '.packages[] | select(.name == "a3s-oci-agent") | .version'
          )"
          file "$agent"
          cp "$agent" "$rootfs_dir/usr/bin/a3s-oci-agent"
          chmod 0755 "$rootfs_dir/usr/bin/a3s-oci-agent"

          cp target/debug/a3s-oci-krun-shim "$signed_dir/"
          cp -R target/debug/a3s-oci-krun-runtime "$signed_dir/"
          codesign --force --sign - \
            --entitlements packaging/macos/a3s-oci-hvf.entitlements \
            "$signed_dir/a3s-oci-krun-shim"
          codesign --verify --strict "$signed_dir/a3s-oci-krun-shim"

          endpoint_baseline="$(
            find /private/tmp -maxdepth 1 \
              -name 'a3s-oci-agent-*' -print | sort
          )"
          set +e
          output="$(
            target/debug/a3s-oci agent-vm-smoke \
              --shim "$signed_dir/a3s-oci-krun-shim" \
              --rootfs "$rootfs_dir" \
              --console "$signed_console"
          )"
          status=$?
          set -e
          printf '%s\n' "$output"

          support="$(sysctl -n kern.hv_support 2>/dev/null || printf unavailable)"
          if [[ "$support" == "1" ]]; then
            test "$status" -eq 0
            jq --exit-status --arg agent_version "$agent_version" \
              '.schema_version == "a3s.oci.agent-vm-smoke.v4"
               and .platform == "macos" and .status == "available"
               and .endpoint_bound and .shim_spawned
               and (.endpoint_name | startswith("a3s-oci-agent-"))
               and (.shim_process_id > 0)
               and (.bridge_process_id > 0)
               and (.bridge_process_id != .shim_process_id)
               and .shim_client_verified and .protocol_negotiated
               and .selected_protocol == 2
               and .agent_version == $agent_version
               and .guest_architecture == "aarch64"
               and .advertised_operations
                   == ["create", "state", "start", "kill", "delete", "wait"]
               and .shim_report_verified and .shim_exit_code == 0
               and .console_created
               and .shim_report.platform == "macos"
               and .shim_report.status == "available"
               and .shim_report.guest_exit_code == 0
               and .macos_cleanup.endpoint_removed
               and .macos_cleanup.shim_reaped
               and .macos_cleanup.bridge_reaped
               and (.macos_cleanup.open_descriptors_before > 0)
               and (.macos_cleanup.open_descriptors_before
                    == .macos_cleanup.open_descriptors_after)
               and .macos_cleanup.descriptor_inventory_restored
               and (.macos_cleanup.reason == null)' \
              <<<"$output" >/dev/null
          else
            test "$status" -eq 2
            jq --exit-status \
              '.schema_version == "a3s.oci.agent-vm-smoke.v4"
               and .platform == "macos" and .status == "unavailable"
               and (.endpoint_name | startswith("a3s-oci-agent-"))
               and (.protocol_negotiated | not)
               and (.shim_report_verified | not)
               and .macos_cleanup.endpoint_removed
               and .macos_cleanup.shim_reaped
               and .macos_cleanup.bridge_reaped
               and (.macos_cleanup.open_descriptors_before > 0)
               and (.macos_cleanup.open_descriptors_before
                    == .macos_cleanup.open_descriptors_after)
               and .macos_cleanup.descriptor_inventory_restored
               and (.macos_cleanup.reason == null)
               and (.reason | length > 0)' \
              <<<"$output" >/dev/null
          fi

          cp target/debug/a3s-oci-krun-shim "$unsigned_dir/"
          cp -R target/debug/a3s-oci-krun-runtime "$unsigned_dir/"
          set +e
          unsigned_output="$(
            target/debug/a3s-oci agent-vm-smoke \
              --shim "$unsigned_dir/a3s-oci-krun-shim" \
              --rootfs "$rootfs_dir" \
              --console "$unsigned_console"
          )"
          unsigned_status=$?
          set -e
          printf '%s\n' "$unsigned_output"
          test "$unsigned_status" -eq 2
          jq --exit-status \
            '.schema_version == "a3s.oci.agent-vm-smoke.v4"
             and .platform == "macos" and .status == "unavailable"
             and .endpoint_bound and .shim_spawned
             and (.endpoint_name | startswith("a3s-oci-agent-"))
             and (.protocol_negotiated | not)
             and (.shim_report_verified | not)
             and .macos_cleanup.endpoint_removed
             and .macos_cleanup.shim_reaped
             and .macos_cleanup.bridge_reaped
             and (.macos_cleanup.open_descriptors_before > 0)
             and (.macos_cleanup.open_descriptors_before
                  == .macos_cleanup.open_descriptors_after)
             and .macos_cleanup.descriptor_inventory_restored
             and (.macos_cleanup.reason == null)
             and (.reason | length > 0)' \
            <<<"$unsigned_output" >/dev/null

          endpoint_after="$(
            find /private/tmp -maxdepth 1 \
              -name 'a3s-oci-agent-*' -print | sort
          )"
          test "$endpoint_after" = "$endpoint_baseline"
      - if: runner.os == 'macOS'
        name: Fixed macOS OCI lifecycle or fail-closed worker
        shell: bash
        run: |
          rootfs_dir="$RUNNER_TEMP/a3s-oci-alpine-aarch64"
          rootfs_archive="$RUNNER_TEMP/alpine-minirootfs-3.22.5-aarch64.tar.gz"
          signed_dir="$RUNNER_TEMP/a3s-oci-agent-vm-signed"
          unsigned_dir="$RUNNER_TEMP/a3s-oci-agent-vm-unsigned"
          bundle_dir="$rootfs_dir/var/lib/a3s-oci-smoke/bundle"
          container_rootfs="$bundle_dir/rootfs"
          marker="$container_rootfs/.a3s-oci-create-start-smoke"
          console="$RUNNER_TEMP/a3s-oci-fixed-lifecycle.log"
          unsigned_console="$RUNNER_TEMP/a3s-oci-fixed-lifecycle-unsigned.log"
          mkdir -p "$container_rootfs"
          cp fixtures/utility-vm/config.json "$bundle_dir/config.json"
          tar -xzf "$rootfs_archive" -C "$container_rootfs"

          endpoint_baseline="$(
            find /private/tmp -maxdepth 1 \
              -name 'a3s-oci-agent-*' -print | sort
          )"
          set +e
          output="$(
            target/debug/a3s-oci oci-vm-smoke \
              --shim "$signed_dir/a3s-oci-krun-shim" \
              --vm-rootfs "$rootfs_dir" \
              --bundle "$bundle_dir" \
              --console "$console"
          )"
          status=$?
          set -e
          printf '%s\n' "$output"

          support="$(sysctl -n kern.hv_support 2>/dev/null || printf unavailable)"
          if [[ "$support" == "1" ]]; then
            test "$status" -eq 0
            jq --exit-status \
              '.schema_version == "a3s.oci.oci-vm-smoke.v4"
               and .platform == "macos" and .status == "available"
               and .bundle_loaded
               and .create_returned_created and .create_replayed
               and (.created_pid > 0)
               and .marker_absent_after_create
               and .start_released and .running_observed
               and .kill_delivered and .kill_replayed
               and .wait_timeout_enforced
               and .wait_exit_status
                   == {"exit_code": 0, "oom_killed": false}
               and .wait_replayed
               and .stopped_observed and .marker_verified
               and .delete_succeeded and .delete_replayed
               and .state_missing_after_delete
               and .marker_removed and .guest_runtime_clean
               and .bridge.platform == "macos"
               and .bridge.status == "available"
               and .bridge.endpoint_bound and .bridge.shim_spawned
               and (.bridge.endpoint_name
                    | startswith("a3s-oci-agent-"))
               and (.bridge.shim_process_id > 0)
               and (.bridge.bridge_process_id > 0)
               and (.bridge.bridge_process_id
                    != .bridge.shim_process_id)
               and .bridge.shim_client_verified
               and .bridge.protocol_negotiated
               and .bridge.selected_protocol == 2
               and .bridge.guest_architecture == "aarch64"
               and .bridge.advertised_operations
                   == ["create", "state", "start", "kill", "delete", "wait"]
               and .bridge.shim_report_verified
               and .bridge.shim_exit_code == 0
               and .bridge.console_created
               and .bridge.macos_cleanup.endpoint_removed
               and .bridge.macos_cleanup.shim_reaped
               and .bridge.macos_cleanup.bridge_reaped
               and (.bridge.macos_cleanup.open_descriptors_before > 0)
               and (.bridge.macos_cleanup.open_descriptors_before
                    == .bridge.macos_cleanup.open_descriptors_after)
               and .bridge.macos_cleanup.descriptor_inventory_restored
               and (.bridge.macos_cleanup.reason == null)' \
              <<<"$output" >/dev/null
          else
            test "$status" -eq 2
            jq --exit-status \
              '.schema_version == "a3s.oci.oci-vm-smoke.v4"
               and .platform == "macos" and .status == "unavailable"
               and .bundle_loaded
               and .bridge.platform == "macos"
               and .bridge.status == "unavailable"
               and (.bridge.endpoint_name
                    | startswith("a3s-oci-agent-"))
               and (.bridge.protocol_negotiated | not)
               and .bridge.macos_cleanup.endpoint_removed
               and .bridge.macos_cleanup.shim_reaped
               and .bridge.macos_cleanup.bridge_reaped
               and (.bridge.macos_cleanup.open_descriptors_before > 0)
               and (.bridge.macos_cleanup.open_descriptors_before
                    == .bridge.macos_cleanup.open_descriptors_after)
               and .bridge.macos_cleanup.descriptor_inventory_restored
               and (.bridge.macos_cleanup.reason == null)
               and (.reason | length > 0)' \
              <<<"$output" >/dev/null
          fi

          set +e
          unsigned_output="$(
            target/debug/a3s-oci oci-vm-smoke \
              --shim "$unsigned_dir/a3s-oci-krun-shim" \
              --vm-rootfs "$rootfs_dir" \
              --bundle "$bundle_dir" \
              --console "$unsigned_console"
          )"
          unsigned_status=$?
          set -e
          printf '%s\n' "$unsigned_output"
          test "$unsigned_status" -eq 2
          jq --exit-status \
            '.schema_version == "a3s.oci.oci-vm-smoke.v4"
             and .platform == "macos" and .status == "unavailable"
             and .bundle_loaded
             and (.create_returned_created | not)
             and .bridge.platform == "macos"
             and .bridge.status == "unavailable"
             and .bridge.endpoint_bound and .bridge.shim_spawned
             and (.bridge.endpoint_name
                  | startswith("a3s-oci-agent-"))
             and (.bridge.protocol_negotiated | not)
             and (.bridge.shim_report_verified | not)
             and .bridge.macos_cleanup.endpoint_removed
             and .bridge.macos_cleanup.shim_reaped
             and .bridge.macos_cleanup.bridge_reaped
             and (.bridge.macos_cleanup.open_descriptors_before > 0)
             and (.bridge.macos_cleanup.open_descriptors_before
                  == .bridge.macos_cleanup.open_descriptors_after)
             and .bridge.macos_cleanup.descriptor_inventory_restored
             and (.bridge.macos_cleanup.reason == null)
             and (.reason | length > 0)' \
            <<<"$unsigned_output" >/dev/null

          endpoint_after="$(
            find /private/tmp -maxdepth 1 \
              -name 'a3s-oci-agent-*' -print | sort
          )"
          test "$endpoint_after" = "$endpoint_baseline"
          test ! -e "$marker"
      - if: runner.os == 'macOS'
        name: Multi-container macOS OCI lifecycle or fail-closed worker
        shell: bash
        run: |
          rootfs_dir="$RUNNER_TEMP/a3s-oci-alpine-aarch64"
          rootfs_archive="$RUNNER_TEMP/alpine-minirootfs-3.22.5-aarch64.tar.gz"
          signed_dir="$RUNNER_TEMP/a3s-oci-agent-vm-signed"
          bundle_a="$rootfs_dir/var/lib/a3s-oci-smoke/bundle"
          bundle_b="$rootfs_dir/var/lib/a3s-oci-smoke/bundle-b"
          marker_a="$bundle_a/rootfs/.a3s-oci-create-start-smoke"
          marker_b="$bundle_b/rootfs/.a3s-oci-create-start-smoke"
          console="$RUNNER_TEMP/a3s-oci-multi-container.log"
          mkdir -p "$bundle_b/rootfs"
          cp fixtures/utility-vm/config.json "$bundle_b/config.json"
          tar -xzf "$rootfs_archive" -C "$bundle_b/rootfs"

          endpoint_baseline="$(
            find /private/tmp -maxdepth 1 \
              -name 'a3s-oci-agent-*' -print | sort
          )"
          runtime_baseline="$(
            find "$rootfs_dir/run" -maxdepth 1 \
              -name 'a3s-oci-agent-*' -print | sort
          )"
          set +e
          output="$(
            target/debug/a3s-oci oci-vm-multi-container-smoke \
              --shim "$signed_dir/a3s-oci-krun-shim" \
              --vm-rootfs "$rootfs_dir" \
              --bundle-a "$bundle_a" \
              --bundle-b "$bundle_b" \
              --console "$console"
          )"
          status=$?
          set -e
          printf '%s\n' "$output"

          support="$(sysctl -n kern.hv_support 2>/dev/null || printf unavailable)"
          if [[ "$support" == "1" ]]; then
            test "$status" -eq 0
            jq --exit-status \
              '.schema_version == "a3s.oci.oci-vm-multi-container-smoke.v2"
               and .platform == "macos" and .status == "available"
               and .bundles_loaded
               and .lifecycle.distinct_bundle_directories
               and .lifecycle.distinct_rootfs_directories
               and .lifecycle.both_created_before_start
               and .lifecycle.initial_generation_a == 1
               and .lifecycle.initial_generation_b == 1
               and .lifecycle.recreated_generation_a == 2
               and (.lifecycle.created_pid_a > 0)
               and (.lifecycle.created_pid_b > 0)
               and .lifecycle.distinct_created_pids
               and .lifecycle.create_replays_exact
               and .lifecycle.both_markers_absent_before_start
               and .lifecycle.start_a_replayed
               and .lifecycle.marker_a_verified
               and .lifecycle.b_unchanged_after_a_start
               and .lifecycle.marker_b_absent_after_a_start
               and .lifecycle.wait_a_did_not_block_b
               and .lifecycle.kill_a_replayed
               and .lifecycle.a_stopped
               and .lifecycle.wait_status_a
                   == {"exit_code": 0, "oom_killed": false}
               and .lifecycle.wait_a_replayed
               and .lifecycle.b_unchanged_after_a_kill
               and .lifecycle.marker_b_absent_after_a_kill
               and .lifecycle.delete_a_replayed
               and .lifecycle.a_missing_after_delete
               and .lifecycle.b_unchanged_after_a_delete
               and .lifecycle.stale_generation_rejected
               and .lifecycle.generation_a_monotonic
               and .lifecycle.recreate_a_replayed
               and .lifecycle.marker_a_absent_after_recreate
               and .lifecycle.cross_container_operation_rejected
               and .lifecycle.b_unchanged_after_replay_conflict
               and .lifecycle.recreated_a_deleted
               and .lifecycle.start_b_replayed
               and .lifecycle.marker_b_verified
               and .lifecycle.kill_b_replayed
               and .lifecycle.b_stopped
               and .lifecycle.wait_status_b
                   == {"exit_code": 0, "oom_killed": false}
               and .lifecycle.wait_b_replayed
               and .lifecycle.delete_b_replayed
               and .lifecycle.b_missing_after_delete
               and .markers_removed and .guest_runtime_clean
               and .bridge.platform == "macos"
               and .bridge.status == "available"
               and .bridge.protocol_negotiated
               and .bridge.selected_protocol == 2
               and .bridge.advertised_operations
                   == ["create", "state", "start", "kill", "delete", "wait"]
               and .bridge.shim_report_verified
               and .bridge.shim_exit_code == 0
               and .bridge.macos_cleanup.endpoint_removed
               and .bridge.macos_cleanup.shim_reaped
               and .bridge.macos_cleanup.bridge_reaped
               and (.bridge.macos_cleanup.open_descriptors_before > 0)
               and (.bridge.macos_cleanup.open_descriptors_before
                    == .bridge.macos_cleanup.open_descriptors_after)
               and .bridge.macos_cleanup.descriptor_inventory_restored
               and (.bridge.macos_cleanup.reason == null)
               and (.reason == null)' \
              <<<"$output" >/dev/null
          else
            test "$status" -eq 2
            jq --exit-status \
              '.schema_version == "a3s.oci.oci-vm-multi-container-smoke.v2"
               and .platform == "macos" and .status == "unavailable"
               and .bundles_loaded
               and .bridge.platform == "macos"
               and .bridge.status == "unavailable"
               and (.bridge.protocol_negotiated | not)
               and .bridge.macos_cleanup.endpoint_removed
               and .bridge.macos_cleanup.shim_reaped
               and .bridge.macos_cleanup.bridge_reaped
               and (.bridge.macos_cleanup.open_descriptors_before > 0)
               and (.bridge.macos_cleanup.open_descriptors_before
                    == .bridge.macos_cleanup.open_descriptors_after)
               and .bridge.macos_cleanup.descriptor_inventory_restored
               and (.bridge.macos_cleanup.reason == null)
               and (.reason | length > 0)' \
              <<<"$output" >/dev/null
          fi

          endpoint_after="$(
            find /private/tmp -maxdepth 1 \
              -name 'a3s-oci-agent-*' -print | sort
          )"
          runtime_after="$(
            find "$rootfs_dir/run" -maxdepth 1 \
              -name 'a3s-oci-agent-*' -print | sort
          )"
          test "$endpoint_after" = "$endpoint_baseline"
          test "$runtime_after" = "$runtime_baseline"
          test ! -e "$marker_a"
          test ! -e "$marker_b"
      - if: runner.os == 'macOS'
        name: Fault-injected macOS OCI cleanup
        shell: bash
        run: |
          rootfs_dir="$RUNNER_TEMP/a3s-oci-alpine-aarch64"
          signed_dir="$RUNNER_TEMP/a3s-oci-agent-vm-signed"
          bundle_dir="$rootfs_dir/var/lib/a3s-oci-smoke/bundle"
          marker="$bundle_dir/rootfs/.a3s-oci-create-start-smoke"
          support="$(sysctl -n kern.hv_support 2>/dev/null || printf unavailable)"
          endpoint_baseline="$(
            find /private/tmp -maxdepth 1 \
              -name 'a3s-oci-agent-*' -print | sort
          )"
          runtime_baseline="$(
            find "$rootfs_dir/run" -maxdepth 1 \
              -name 'a3s-oci-agent-*' -print | sort
          )"

          for phase in after-create after-start after-kill; do
            console="$RUNNER_TEMP/a3s-oci-fault-$phase.log"
            set +e
            output="$(
              target/debug/a3s-oci oci-vm-fault-cleanup \
                --shim "$signed_dir/a3s-oci-krun-shim" \
                --vm-rootfs "$rootfs_dir" \
                --bundle "$bundle_dir" \
                --console "$console" \
                --fault-after "$phase"
            )"
            status=$?
            set -e
            printf '%s\n' "$output"

            if [[ "$support" == "1" ]]; then
              test "$status" -eq 0
              jq --exit-status --arg phase "$phase" \
                '.schema_version == "a3s.oci.oci-vm-fault-cleanup.v2"
                 and .platform == "macos" and .status == "available"
                 and .bundle_loaded
                 and .lifecycle.requested_fault == $phase
                 and .lifecycle.injected_fault == $phase
                 and .lifecycle.create_completed
                 and (.lifecycle.created_pid > 0)
                 and .lifecycle.marker_absent_after_create
                 and (.lifecycle.normal_delete_attempted | not)
                 and (if $phase == "after-create" then
                        (.lifecycle.start_completed | not)
                        and (.lifecycle.kill_completed | not)
                        and (.lifecycle.marker_verified_after_start | not)
                      elif $phase == "after-start" then
                        .lifecycle.start_completed
                        and (.lifecycle.kill_completed | not)
                        and .lifecycle.marker_verified_after_start
                      else
                        .lifecycle.start_completed
                        and .lifecycle.kill_completed
                        and .lifecycle.marker_verified_after_start
                      end)
                 and .marker_removed and .guest_runtime_clean
                 and .bridge.status == "available"
                 and .bridge.protocol_negotiated
                 and .bridge.selected_protocol == 2
                 and .bridge.advertised_operations
                     == ["create", "state", "start", "kill", "delete", "wait"]
                 and .bridge.shim_report_verified
                 and .bridge.shim_exit_code == 0
                 and .bridge.macos_cleanup.endpoint_removed
                 and .bridge.macos_cleanup.shim_reaped
                 and .bridge.macos_cleanup.bridge_reaped
                 and (.bridge.macos_cleanup.open_descriptors_before > 0)
                 and (.bridge.macos_cleanup.open_descriptors_before
                      == .bridge.macos_cleanup.open_descriptors_after)
                 and .bridge.macos_cleanup.descriptor_inventory_restored
                 and (.bridge.macos_cleanup.reason == null)
                 and (.reason == null)' \
                <<<"$output" >/dev/null
            else
              test "$status" -eq 2
              jq --exit-status --arg phase "$phase" \
                '.schema_version == "a3s.oci.oci-vm-fault-cleanup.v2"
                 and .platform == "macos" and .status == "unavailable"
                 and .bundle_loaded
                 and .lifecycle.requested_fault == $phase
                 and (.lifecycle.injected_fault == null)
                 and (.lifecycle.normal_delete_attempted | not)
                 and .bridge.status == "unavailable"
                 and .bridge.macos_cleanup.endpoint_removed
                 and .bridge.macos_cleanup.shim_reaped
                 and .bridge.macos_cleanup.bridge_reaped
                 and (.bridge.macos_cleanup.open_descriptors_before > 0)
                 and (.bridge.macos_cleanup.open_descriptors_before
                      == .bridge.macos_cleanup.open_descriptors_after)
                 and .bridge.macos_cleanup.descriptor_inventory_restored
                 and (.bridge.macos_cleanup.reason == null)
                 and (.reason | length > 0)' \
                <<<"$output" >/dev/null
            fi

            endpoint_after="$(
              find /private/tmp -maxdepth 1 \
                -name 'a3s-oci-agent-*' -print | sort
            )"
            runtime_after="$(
              find "$rootfs_dir/run" -maxdepth 1 \
                -name 'a3s-oci-agent-*' -print | sort
            )"
            test "$endpoint_after" = "$endpoint_baseline"
            test "$runtime_after" = "$runtime_baseline"
            test ! -e "$marker"
          done
      - if: runner.os == 'Linux'
        name: Native Linux SDK lifecycle without KVM
        run: bash .github/scripts/native-linux-smoke.sh
      - if: runner.os == 'Windows'
        run: cargo run -p a3s-oci-krun --bin a3s-oci-krun-shim -- context-smoke

  native-linux-arm64:
    name: native-linux-lifecycle (aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash .github/scripts/native-linux-smoke.sh

  guest-agent-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo build -p a3s-oci-agent --release
          --target x86_64-unknown-linux-musl
      - name: Build static aarch64 guest agent
        shell: bash
        run: |
          host_triple="$(rustc -vV | sed -n 's/^host: //p')"
          rust_lld="$(
            rustc --print sysroot
          )/lib/rustlib/$host_triple/bin/rust-lld"
          test -x "$rust_lld"
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER="$rust_lld" \
            cargo build -p a3s-oci-agent --release \
              --target aarch64-unknown-linux-musl
      - name: Verify static guest artifact
        shell: bash
        run: |
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            agent="target/$target/release/a3s-oci-agent"
            file "$agent"
            if readelf --program-headers "$agent" | grep --quiet INTERP; then
              echo "$agent contains a dynamic interpreter" >&2
              exit 1
            fi
            if readelf --dynamic "$agent" | grep --quiet NEEDED; then
              echo "$agent contains a dynamic dependency" >&2
              exit 1
            fi
          done
