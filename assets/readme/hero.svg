<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">A3S OCI Runtime — exact lifecycle across execution drivers</title>
  <desc id="desc">A durable OCI lifecycle rail binds a container ID to an exact generation, operation journal, and evidence-gated Native Linux, HVF, or WHPX driver.</desc>

  <rect width="1200" height="460" rx="24" fill="#081018"/>
  <path d="M612 32V428" stroke="#273748" stroke-width="1.5"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, sans-serif">
    <g transform="translate(58 52)">
      <path d="M10 0H0v40h10M30 0h10v40H30" fill="none" stroke="#68c7ff" stroke-width="2.5"/>
      <circle cx="20" cy="20" r="7" fill="none" stroke="#f3f7fa" stroke-width="2"/>
      <circle cx="20" cy="20" r="2.8" fill="#68c7ff"/>
    </g>
    <text x="116" y="78" fill="#91a2b3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="2.4">OCI EXECUTION PLANE / v0.2</text>

    <text x="58" y="165" fill="#f3f7fa" font-size="68" font-weight="760" letter-spacing="-2.3">A3S OCI</text>
    <text x="58" y="232" fill="#68c7ff" font-size="68" font-weight="760" letter-spacing="-2.3">RUNTIME</text>

    <text x="60" y="284" fill="#c7d2dc" font-size="25" font-weight="600">One typed contract for actual execution.</text>
    <text x="60" y="320" fill="#91a2b3" font-size="22" font-weight="500">Exact generations. Durable replay. No silent fallback.</text>

    <g transform="translate(58 372)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="0.8">
      <g>
        <rect width="126" height="40" rx="6" fill="#101b26" stroke="#30465a"/>
        <text x="63" y="26" text-anchor="middle" fill="#dbe7f0">OCI 1.3</text>
      </g>
      <g transform="translate(140)">
        <rect width="142" height="40" rx="6" fill="#101b26" stroke="#30465a"/>
        <text x="71" y="26" text-anchor="middle" fill="#dbe7f0">RUST SDK</text>
      </g>
      <g transform="translate(296)">
        <rect width="156" height="40" rx="6" fill="#101b26" stroke="#30465a"/>
        <text x="78" y="26" text-anchor="middle" fill="#dbe7f0">LOCAL IPC</text>
      </g>
    </g>
  </g>

  <g id="lifecycle-proof" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, sans-serif">
    <text x="660" y="62" fill="#91a2b3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="1.8">EXACT TARGET</text>
    <rect x="660" y="78" width="482" height="58" rx="8" fill="#101b26" stroke="#3b5972" stroke-width="1.5"/>
    <path d="M686 91h-8v32h8M1116 91h8v32h-8" fill="none" stroke="#68c7ff" stroke-width="2"/>
    <text x="901" y="114" text-anchor="middle" fill="#f3f7fa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700">(container id, generation)</text>

    <g id="lifecycle-rail">
      <path d="M688 205H1116" stroke="#40566b" stroke-width="3"/>
      <path d="m1110 198 8 7-8 7" fill="none" stroke="#40566b" stroke-width="2.5"/>

      <circle cx="694" cy="205" r="9" fill="#081018" stroke="#68c7ff" stroke-width="3"/>
      <circle cx="835" cy="205" r="9" fill="#081018" stroke="#68c7ff" stroke-width="3"/>
      <circle cx="976" cy="205" r="9" fill="#081018" stroke="#7ee2a8" stroke-width="3"/>
      <circle cx="1112" cy="205" r="9" fill="#081018" stroke="#f0b85a" stroke-width="3"/>

      <text x="694" y="179" text-anchor="middle" fill="#dbe7f0" font-size="20" font-weight="700">creating</text>
      <text x="835" y="237" text-anchor="middle" fill="#dbe7f0" font-size="20" font-weight="700">created</text>
      <text x="976" y="179" text-anchor="middle" fill="#dbe7f0" font-size="20" font-weight="700">running</text>
      <text x="1112" y="237" text-anchor="middle" fill="#dbe7f0" font-size="20" font-weight="700">stopped</text>

      <text x="765" y="194" text-anchor="middle" fill="#91a2b3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">create</text>
      <text x="906" y="194" text-anchor="middle" fill="#91a2b3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">start</text>
      <text x="1044" y="194" text-anchor="middle" fill="#91a2b3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">exit</text>
    </g>

    <rect x="660" y="273" width="482" height="150" rx="10" fill="#0d1822" stroke="#2b4053" stroke-width="1.5"/>
    <text x="684" y="306" fill="#f3f7fa" font-size="23" font-weight="720">Host service</text>
    <g transform="translate(860 286)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">
      <text x="0" y="18" fill="#68c7ff">JOURNAL</text>
      <text x="75" y="18" fill="#7ee2a8">REPLAY</text>
      <text x="140" y="18" fill="#f0b85a">FENCE</text>
    </g>

    <g transform="translate(680 326)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">
      <g>
        <rect width="140" height="55" rx="6" fill="#102219" stroke="#3e7654"/>
        <text x="70" y="22" text-anchor="middle" fill="#dff8e8">NATIVE LINUX</text>
        <text x="70" y="43" text-anchor="middle" fill="#7ee2a8">EXPLICIT EXP.</text>
      </g>
      <g transform="translate(151)">
        <rect width="140" height="55" rx="6" fill="#211b12" stroke="#735b31"/>
        <text x="70" y="22" text-anchor="middle" fill="#f6ead4">HVF</text>
        <text x="70" y="43" text-anchor="middle" fill="#f0b85a">PROBE-ONLY</text>
      </g>
      <g transform="translate(302)">
        <rect width="140" height="55" rx="6" fill="#211b12" stroke="#735b31"/>
        <text x="70" y="22" text-anchor="middle" fill="#f6ead4">WHPX</text>
        <text x="70" y="43" text-anchor="middle" fill="#f0b85a">PROBE-ONLY</text>
      </g>
    </g>

    <text x="901" y="408" text-anchor="middle" fill="#91a2b3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">readiness comes from retained evidence</text>
  </g>
</svg>
