<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">A3S OCI Runtime — durable execution across owner replacement</title>
  <desc id="desc">A3S OCI Runtime binds each container generation and operation journal to one execution owner, then verifies Create, State, Start, Kill, Delete, Wait, and Exec across real HVF owner replacement without claiming supported readiness.</desc>

  <rect width="1200" height="420" rx="22" fill="#071018"/>
  <path d="M612 30V390" stroke="#263746" stroke-width="1.5"/>

  <g id="identity" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, sans-serif">
    <g transform="translate(58 46)">
      <path d="M10 0H0v38h10M28 0h10v38H28" fill="none" stroke="#67c8ff" stroke-width="2.5"/>
      <circle cx="19" cy="19" r="7" fill="none" stroke="#f4f7fa" stroke-width="2"/>
      <circle cx="19" cy="19" r="2.8" fill="#67c8ff"/>
    </g>
    <text x="112" y="72" fill="#90a2b3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="2.2">OCI EXECUTION PLANE / 0.2</text>

    <text x="58" y="154" fill="#f4f7fa" font-size="66" font-weight="760" letter-spacing="-2.2">A3S OCI</text>
    <text x="58" y="218" fill="#67c8ff" font-size="66" font-weight="760" letter-spacing="-2.2">RUNTIME</text>

    <text x="60" y="267" fill="#d4dde5" font-size="24" font-weight="650">Durable Linux execution for A3S.</text>
    <text x="60" y="301" fill="#90a2b3" font-size="21">Exact generations, replayable operations, explicit readiness.</text>

    <g transform="translate(58 330)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <rect width="500" height="48" rx="7" fill="#0d1923" stroke="#35516a" stroke-width="1.5"/>
      <text x="18" y="20" fill="#90a2b3" font-size="16" font-weight="700" letter-spacing="1.2">DURABLE IDENTITY</text>
      <text x="18" y="39" fill="#e3ebf1" font-size="18" font-weight="700">(container_id, generation, operation_id)</text>
    </g>

    <g transform="translate(58 392)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" letter-spacing="0.7">
      <circle cx="7" cy="-5" r="5" fill="#f0b85a"/>
      <text x="22" y="0" fill="#f3d9ab">NO DRIVER CLAIMS SUPPORTED YET</text>
    </g>
  </g>

  <g id="owner-replacement-proof" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, sans-serif">
    <text x="642" y="56" fill="#90a2b3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="1.7">REAL HVF OWNER REPLACEMENT</text>

    <g id="handoff" transform="translate(642 76)">
      <rect width="142" height="70" rx="8" fill="#102219" stroke="#3e7654" stroke-width="1.5"/>
      <text x="71" y="29" text-anchor="middle" fill="#dff8e8" font-size="20" font-weight="720">OWNER A</text>
      <text x="71" y="52" text-anchor="middle" fill="#7de2a8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">INTERRUPT</text>

      <path d="M150 35h40" stroke="#516678" stroke-width="2"/>
      <path d="m184 29 7 6-7 6" fill="none" stroke="#516678" stroke-width="2"/>

      <rect x="198" width="150" height="70" rx="8" fill="#0d1923" stroke="#4a6e89" stroke-width="1.5"/>
      <text x="273" y="29" text-anchor="middle" fill="#e3ebf1" font-size="20" font-weight="720">DURABLE ROOT</text>
      <text x="273" y="52" text-anchor="middle" fill="#67c8ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">REOPEN</text>

      <path d="M356 35h40" stroke="#516678" stroke-width="2"/>
      <path d="m390 29 7 6-7 6" fill="none" stroke="#516678" stroke-width="2"/>

      <rect x="400" width="140" height="70" rx="8" fill="#102219" stroke="#3e7654" stroke-width="1.5"/>
      <text x="470" y="29" text-anchor="middle" fill="#dff8e8" font-size="20" font-weight="720">OWNER B</text>
      <text x="470" y="52" text-anchor="middle" fill="#7de2a8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">RESUME</text>
    </g>

    <rect x="642" y="168" width="540" height="170" rx="10" fill="#0b1620" stroke="#2b4053" stroke-width="1.5"/>
    <text x="666" y="199" fill="#f4f7fa" font-size="22" font-weight="720">Transport fault matrix</text>
    <text x="1158" y="199" text-anchor="end" fill="#90a2b3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">7 OPERATIONS · 9 STAGES EACH</text>

    <g transform="translate(666 217)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">
      <g>
        <rect width="120" height="42" rx="6" fill="#101e29" stroke="#35516a"/>
        <text x="60" y="28" text-anchor="middle" fill="#dce7ef">CREATE</text>
      </g>
      <g transform="translate(128)">
        <rect width="120" height="42" rx="6" fill="#101e29" stroke="#35516a"/>
        <text x="60" y="28" text-anchor="middle" fill="#dce7ef">STATE</text>
      </g>
      <g transform="translate(256)">
        <rect width="120" height="42" rx="6" fill="#101e29" stroke="#35516a"/>
        <text x="60" y="28" text-anchor="middle" fill="#dce7ef">START</text>
      </g>
      <g transform="translate(384)">
        <rect width="120" height="42" rx="6" fill="#101e29" stroke="#35516a"/>
        <text x="60" y="28" text-anchor="middle" fill="#dce7ef">KILL</text>
      </g>
      <g transform="translate(0 54)">
        <rect width="120" height="42" rx="6" fill="#101e29" stroke="#35516a"/>
        <text x="60" y="28" text-anchor="middle" fill="#dce7ef">DELETE</text>
      </g>
      <g transform="translate(128 54)">
        <rect width="120" height="42" rx="6" fill="#101e29" stroke="#35516a"/>
        <text x="60" y="28" text-anchor="middle" fill="#dce7ef">WAIT</text>
      </g>
      <g transform="translate(256 54)">
        <rect width="120" height="42" rx="6" fill="#101e29" stroke="#35516a"/>
        <text x="60" y="28" text-anchor="middle" fill="#dce7ef">EXEC</text>
      </g>
      <g transform="translate(384 54)">
        <rect width="120" height="42" rx="6" fill="#102219" stroke="#3e7654"/>
        <text x="60" y="28" text-anchor="middle" fill="#7de2a8">63 / 63</text>
      </g>
    </g>

    <g transform="translate(642 354)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="0" y="20" fill="#90a2b3" font-size="17" font-weight="700">PORTABLE REOPEN</text>
      <text x="0" y="46" fill="#f4f7fa" font-size="26" font-weight="760">180 / 180</text>
      <path d="M174 3v48" stroke="#263746" stroke-width="1.5"/>
      <text x="198" y="20" fill="#90a2b3" font-size="17" font-weight="700">REAL OWNER PATHS</text>
      <text x="198" y="46" fill="#67c8ff" font-size="26" font-weight="760">63</text>
      <path d="M408 3v48" stroke="#263746" stroke-width="1.5"/>
      <text x="432" y="20" fill="#90a2b3" font-size="17" font-weight="700">PROTOCOL</text>
      <text x="432" y="46" fill="#f4f7fa" font-size="26" font-weight="760">v10</text>
    </g>
  </g>
</svg>
