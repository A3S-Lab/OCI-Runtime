[package]
name = "a3s-oci-agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Linux guest agent for A3S OCI Runtime"

[[bin]]
name = "a3s-oci-agent"
path = "src/main.rs"

[dependencies]
a3s-oci-agent-protocol = { path = "../agent-protocol" }
a3s-oci-sdk = { path = "../sdk" }
base64.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["dir", "fs", "term"] }
seccompiler = "0.5"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
syscalls = { version = "0.8", default-features = false, features = ["std", "aarch64", "arm", "x86", "x86_64"] }
tokio = { workspace = true, features = ["process", "time"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = "3.20"

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
